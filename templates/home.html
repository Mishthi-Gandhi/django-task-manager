<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Tasks</h1>
    <a href="logout/">Logout</a>
    <form method="POST">
{%csrf_token%}
<input type="text" name="title" placeholder="Enter Task..." required/>
<input type="submit"/>
    </form>
    {% for task in tasks%}
    <div style="display: flex;flex-direction: row;align-items: center;">
        <h2>{{task.title}} </h2>
    {%if task.completed%}
    <a style="text-decoration: none;color: black;" href="{%url 'toggle' task.id %}">✅Completed</a>
    {%else%}
    <a style="text-decoration: none;color: black;" href="{%url 'toggle' task.id %}">❌Pending</a>
    {%endif%}
    </div>
     {%endfor%}
    
</body>
</html>
